<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>단어 수정 - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: mainNavbar}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="mb-4">
                <h1 class="h3 mb-1">단어 정보 수정</h1>
                <p class="text-secondary mb-0">기본형이 잘못된 경우 직접 수정할 수 있습니다.</p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/words/{id}/edit(id=${word.id}, redirectUrl=${redirectUrl})}" th:object="${form}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label for="normalizedText" class="form-label">기본형</label>
                            <input type="text" id="normalizedText" class="form-control" th:field="*{normalizedText}" th:classappend="${#fields.hasErrors('normalizedText')} ? 'is-invalid'" maxlength="255">
                            <div class="form-text" style="color: #dbeafe;">추출 단어: <span th:text="${word.text}">normalized</span></div>

                        </div>

                        <div class="mb-3">
                            <label for="meaning" class="form-label">의미</label>
                            <input type="text" id="meaning" th:field="*{meaning}" class="form-control" th:classappend="${#fields.hasErrors('meaning')} ? 'is-invalid'" maxlength="255" placeholder="예: 사과">
                            <div class="invalid-feedback" th:errors="*{meaning}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="partOfSpeech" class="form-label">품사</label>
                            <select id="partOfSpeech" th:field="*{partOfSpeech}" class="form-select" th:classappend="${#fields.hasErrors('partOfSpeech')} ? 'is-invalid'"
                                    style="background-color: #121a30; color: #f1f5f9; border-color: rgba(255,255,255,0.2);">
                                <option value="" style="background-color: #121a30; color: #f1f5f9;">선택 안 함</option>
                                <option th:each="part : ${partsOfSpeech}" th:value="${part.value()}" th:text="${part.label()}"
                                        style="background-color: #121a30; color: #f1f5f9;">Noun(명사)</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{partOfSpeech}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">저장</button>
                            <a th:href="${redirectUrl}" class="btn btn-outline-secondary">취소</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
