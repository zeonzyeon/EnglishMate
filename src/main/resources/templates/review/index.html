<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EnglishMate</a>
        <div class="d-flex gap-2">
            <a th:href="@{/vocabulary}" class="btn btn-outline-primary btn-sm">My Vocabulary</a>
            <a th:href="@{/mypage}" class="btn btn-outline-secondary btn-sm">My Page</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="mb-4">
        <h1 class="h3 mb-1">Review</h1>
        <p class="text-secondary mb-0">복습할 학습 자료를 선택하고 플래시카드를 시작하세요.</p>
    </div>

    <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>

    <form th:action="@{/review/start}" th:object="${form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <section class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 mb-0">학습 자료 선택</h2>
                    <span class="badge text-bg-light border">
                        <span id="selectedMaterialCount">0</span>개 선택
                    </span>
                </div>

                <label class="border rounded p-3 bg-white d-block mb-2">
                    <input type="checkbox"
                           th:field="*{selectAllMaterials}"
                           id="selectAllMaterials"
                           class="form-check-input me-2">
                    <span class="fw-semibold">전체</span>
                </label>

                <div th:if="${#lists.isEmpty(scopeItems)}" class="text-center text-secondary py-4">
                    등록된 학습 자료가 없습니다.
                </div>

                <div th:unless="${#lists.isEmpty(scopeItems)}" class="vstack gap-2">
                    <label th:each="item : ${scopeItems}" class="border rounded p-3 bg-white">
                        <input type="checkbox"
                               name="selectedStudyMaterialIds"
                               th:value="${item.id()}"
                               class="form-check-input me-2 material-checkbox">
                        <span th:text="${item.title()}">학습 자료</span>
                    </label>
                </div>
            </div>
        </section>

        <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/}" class="btn btn-outline-secondary">취소</a>
            <button type="submit" class="btn btn-primary">복습 시작</button>
        </div>
    </form>
</main>

<script>
    const selectAll = document.getElementById('selectAllMaterials');
    const materialCheckboxes = Array.from(document.querySelectorAll('.material-checkbox'));
    const selectedCount = document.getElementById('selectedMaterialCount');

    function updateSelectedCount() {
        selectedCount.textContent = String(materialCheckboxes.filter((checkbox) => checkbox.checked).length);
    }

    selectAll.addEventListener('change', () => {
        materialCheckboxes.forEach((checkbox) => checkbox.checked = selectAll.checked);
        updateSelectedCount();
    });

    materialCheckboxes.forEach((checkbox) => {
        checkbox.addEventListener('change', () => {
            const checkedCount = materialCheckboxes.filter((item) => item.checked).length;
            selectAll.checked = materialCheckboxes.length > 0 && checkedCount === materialCheckboxes.length;
            updateSelectedCount();
        });
    });

    updateSelectedCount();
</script>
</body>
</html>
