<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review Card - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EnglishMate</a>
        <a th:href="@{/review}" class="btn btn-outline-secondary btn-sm">복습 선택</a>
    </div>
</nav>

<main class="container py-5">
    <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>

    <section class="card border-0 shadow-sm mx-auto" style="max-width: 760px;">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h5 mb-0">
                    <span th:text="${card.cardOrder()}">1</span>
                    /
                    <span th:text="${card.totalCards()}">10</span>
                </h1>
                <span class="badge text-bg-light border">
                    <span th:text="${card.progressPercent()}">10</span>%
                </span>
            </div>

            <div class="progress mb-4">
                <div class="progress-bar" th:style="'width: ' + ${card.progressPercent()} + '%'"></div>
            </div>

            <div class="border rounded bg-light p-5 text-center mb-4">
                <p class="text-secondary mb-2">단어</p>
                <p class="display-4 fw-semibold mb-0" th:text="${card.wordText()}">word</p>
            </div>

            <button id="revealButton" type="button" class="btn btn-outline-primary w-100 mb-3">
                뜻 보기
            </button>

            <div id="cardBack" class="border rounded p-4 mb-4 bg-white d-none">
                <dl class="row mb-3">
                    <dt class="col-sm-3">의미</dt>
                    <dd class="col-sm-9" th:text="${card.meaning()}">meaning</dd>

                    <dt class="col-sm-3">품사</dt>
                    <dd class="col-sm-9" th:text="${card.partOfSpeechLabel()}">-</dd>

                    <dt class="col-sm-3">출처</dt>
                    <dd class="col-sm-9">
                        <span th:if="${#lists.isEmpty(card.sources())}" class="text-secondary">현재 연결된 지문 없음</span>
                        <span th:unless="${#lists.isEmpty(card.sources())}" class="d-flex flex-wrap gap-1">
                            <a th:each="source : ${card.sources()}"
                               th:href="@{/materials/{id}(id=${source.studyMaterialId()})}"
                               class="badge text-bg-light border text-decoration-none"
                               th:text="${source.title()}">출처</a>
                        </span>
                    </dd>
                </dl>

                <button id="hideButton" type="button" class="btn btn-outline-secondary btn-sm w-100">
                    닫기
                </button>
            </div>

            <form th:action="@{/review/{sessionId}/answer(sessionId=${card.reviewSessionId()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="reviewCardResultId" th:value="${card.reviewCardResultId()}">

                <div class="d-flex gap-2">
                    <button type="submit"
                            name="responseType"
                            value="DIFFICULT"
                            class="btn btn-outline-danger flex-fill review-answer">다시 볼래요</button>
                    <button type="submit"
                            name="responseType"
                            value="REMEMBERED"
                            class="btn btn-success flex-fill review-answer">외웠어요</button>
                </div>
            </form>
        </div>
    </section>
</main>

<script>
    const revealButton = document.getElementById('revealButton');
    const hideButton = document.getElementById('hideButton');
    const cardBack = document.getElementById('cardBack');

    revealButton.addEventListener('click', () => {
        cardBack.classList.remove('d-none');
        revealButton.classList.add('d-none');
    });

    hideButton.addEventListener('click', () => {
        cardBack.classList.add('d-none');
        revealButton.classList.remove('d-none');
    });
</script>
</body>
</html>
