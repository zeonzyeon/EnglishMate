<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review Complete - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: mainNavbar}"></div>
<main class="container py-5">
    <div class="mb-4">
        <h1 class="h3 mb-1">복습 완료</h1>
        <p class="text-secondary mb-0">플래시카드 복습이 끝났습니다.</p>
    </div>

    <section class="row g-3 mb-4">
        <div class="col-12 col-md-4">
            <div class="card border-0 shadow-sm"><div class="card-body">
                <p class="text-secondary mb-1">총 카드</p>
                <strong class="h4" th:text="${result.totalCards()}">0</strong>
            </div></div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card border-0 shadow-sm"><div class="card-body">
                <p class="text-secondary mb-1">외웠어요</p>
                <strong class="h4 text-success" th:text="${result.rememberedCount()}">0</strong>
            </div></div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card border-0 shadow-sm"><div class="card-body">
                <p class="text-secondary mb-1">다시 볼래요</p>
                <strong class="h4 text-danger" th:text="${result.difficultCount()}">0</strong>
            </div></div>
        </div>
    </section>

    <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">선택한 학습 자료</h2>
            <div class="d-flex flex-wrap gap-2">
                <span th:each="title : ${result.materialTitles()}"
                      class="badge text-bg-light border"
                      th:text="${title}">자료</span>
            </div>
        </div>
    </section>

    <section class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 90px;">번호</th>
                        <th>단어</th>
                        <th>의미</th>
                        <th>응답</th>
                        <th>출처</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="card : ${result.cardResults()}">
                        <td th:text="${card.cardOrder()}">1</td>
                        <td class="fw-semibold" th:text="${card.wordText()}">word</td>
                        <td th:text="${card.meaning()}">meaning</td>
                        <td th:text="${card.responseLabel()}">응답</td>
                        <td>
                            <span th:if="${#lists.isEmpty(card.sources())}" class="text-secondary">현재 연결된 지문 없음</span>
                            <span th:unless="${#lists.isEmpty(card.sources())}" class="d-flex flex-wrap gap-1">
                                <a th:each="source : ${card.sources()}"
                                   th:href="@{/materials/{id}(id=${source.studyMaterialId()})}"
                                   class="badge text-bg-light border text-decoration-none"
                                   th:text="${source.title()}">출처</a>
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
