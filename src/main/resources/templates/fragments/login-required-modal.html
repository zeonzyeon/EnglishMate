<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="loginRequiredModal" class="modal fade" id="loginRequiredModal" tabindex="-1"
     aria-labelledby="loginRequiredModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="loginRequiredModalTitle">로그인이 필요한 기능입니다.</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="loginRequiredMessage" class="mb-3">
                    회원가입 후 학습자료 등록, 단어장, Quiz, Review 기능을 이용할 수 있습니다.
                </p>
                <p class="text-secondary mb-0 small">
                    로그인하면 나만의 학습 자료와 단어장을 저장할 수 있습니다.
                </p>
            </div>
            <div class="modal-footer">
                <a th:href="@{/login}" class="btn btn-primary">Login</a>
                <a th:href="@{/signup}" class="btn btn-outline-primary">Sign Up</a>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
    (() => {
        const modalElement = document.getElementById('loginRequiredModal');
        const messageElement = document.getElementById('loginRequiredMessage');

        if (!modalElement || !messageElement || typeof bootstrap === 'undefined') {
            return;
        }

        const modal = new bootstrap.Modal(modalElement);
        document.querySelectorAll('[data-login-required-message]').forEach((button) => {
            button.addEventListener('click', () => {
                messageElement.textContent = button.dataset.loginRequiredMessage;
                modal.show();
            });
        });
    })();
</script>
</body>
</html>
