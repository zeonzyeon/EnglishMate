<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="mainNavbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top app-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EnglishMate</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="mainNavbar" class="collapse navbar-collapse">
            <ul class="navbar-nav app-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                       th:classappend="${currentPath == '/'} ? ' active'"
                       th:attrappend="aria-current=${currentPath == '/'} ? 'page'">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/materials}"
                       th:classappend="${currentPath.startsWith('/materials') or currentPath.startsWith('/study-materials')} ? ' active'"
                       th:attrappend="aria-current=${currentPath.startsWith('/materials') or currentPath.startsWith('/study-materials')} ? 'page'">Study Materials</a>
                </li>
                <li class="nav-item" th:if="${loggedIn}">
                    <a class="nav-link" th:href="@{/vocabulary}"
                       th:classappend="${currentPath.startsWith('/vocabulary') or currentPath.startsWith('/words')} ? ' active'"
                       th:attrappend="aria-current=${currentPath.startsWith('/vocabulary') or currentPath.startsWith('/words')} ? 'page'">My Vocabulary</a>
                </li>
                <li class="nav-item" th:if="${loggedIn}">
                    <a class="nav-link" th:href="@{/quiz}"
                       th:classappend="${currentPath.startsWith('/quiz')} ? ' active'"
                       th:attrappend="aria-current=${currentPath.startsWith('/quiz')} ? 'page'">Quiz</a>
                </li>
                <li class="nav-item" th:if="${loggedIn}">
                    <a class="nav-link" th:href="@{/review}"
                       th:classappend="${currentPath.startsWith('/review')} ? ' active'"
                       th:attrappend="aria-current=${currentPath.startsWith('/review')} ? 'page'">Review</a>
                </li>
                <li class="nav-item" th:unless="${loggedIn}">
                    <a class="nav-link" th:href="@{/login}"
                       th:classappend="${currentPath.startsWith('/login')} ? ' active'"
                       th:attrappend="aria-current=${currentPath.startsWith('/login')} ? 'page'">Login</a>
                </li>
            </ul>

            <div th:if="${loggedIn}" class="d-flex align-items-lg-center gap-2 flex-column flex-lg-row">
                <a th:href="@{/mypage}" class="profile-link"
                   th:classappend="${currentPath.startsWith('/mypage')} ? ' active'"
                   th:attrappend="aria-current=${currentPath.startsWith('/mypage')} ? 'page'">
                    <span class="profile-icon" aria-hidden="true"></span>
                    <span>My Page</span>
                </a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
