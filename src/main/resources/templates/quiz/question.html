<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Question - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EnglishMate</a>
        <a th:href="@{/quiz}" class="btn btn-outline-secondary btn-sm">퀴즈 선택</a>
    </div>
</nav>

<main class="container py-5">
    <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>

    <section class="card border-0 shadow-sm mx-auto" style="max-width: 760px;">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <p class="text-secondary mb-1" th:text="${question.quizTypeLabel()}">퀴즈 유형</p>
                    <h1 class="h5 mb-0">
                        <span th:text="${question.questionOrder()}">1</span>
                        /
                        <span th:text="${question.totalQuestions()}">10</span>
                    </h1>
                </div>
                <span class="badge text-bg-light border">
                    <span th:text="${question.progressPercent()}">10</span>%
                </span>
            </div>

            <div class="progress mb-4" role="progressbar">
                <div class="progress-bar"
                     th:style="'width: ' + ${question.progressPercent()} + '%'"
                     th:aria-valuenow="${question.progressPercent()}"
                     aria-valuemin="0"
                     aria-valuemax="100"></div>
            </div>

            <div class="border rounded bg-light p-4 mb-4">
                <p class="text-secondary mb-2">문제</p>
                <p class="display-6 fw-semibold mb-0" th:text="${question.questionText()}">question</p>
            </div>

            <form th:if="${!question.answered()}"
                  th:action="@{/quiz/attempts/{attemptId}/questions/{questionOrder}/answer(attemptId=${question.attemptId()}, questionOrder=${question.questionOrder()})}"
                  method="post"
                  class="vstack gap-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div th:if="${question.multipleChoice()}" class="vstack gap-2">
                    <label th:each="choice : ${question.choices()}" class="border rounded p-3 bg-white">
                        <input type="radio"
                               name="submittedAnswer"
                               th:value="${choice}"
                               class="form-check-input me-2"
                               required>
                        <span th:text="${choice}">choice</span>
                    </label>
                </div>

                <div th:unless="${question.multipleChoice()}">
                    <label for="submittedAnswer" class="form-label">답안</label>
                    <input type="text"
                           id="submittedAnswer"
                           name="submittedAnswer"
                           class="form-control"
                           autocomplete="off"
                           required>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">답안 제출</button>
                </div>
            </form>

            <div th:if="${question.answered()}" class="mt-4">
                <div th:class="${question.correct()} ? 'alert alert-success' : 'alert alert-danger'">
                    <strong th:text="${question.correct()} ? '정답입니다.' : '오답입니다.'">결과</strong>
                    <div class="mt-2">
                        제출한 답:
                        <span th:text="${question.submittedAnswer()}">답안</span>
                    </div>
                    <div>
                        실제 정답:
                        <span class="fw-semibold" th:text="${question.correctAnswer()}">정답</span>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:if="${question.questionOrder() < question.totalQuestions()}"
                       th:href="@{/quiz/attempts/{attemptId}/questions/{nextOrder}(attemptId=${question.attemptId()}, nextOrder=${question.questionOrder() + 1})}"
                       class="btn btn-primary">다음 문제</a>
                    <a th:if="${question.questionOrder() == question.totalQuestions()}"
                       th:href="@{/quiz/attempts/{attemptId}/result(attemptId=${question.attemptId()})}"
                       class="btn btn-primary">결과 보기</a>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
