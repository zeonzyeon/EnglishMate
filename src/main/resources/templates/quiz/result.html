<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Result - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: mainNavbar}"></div>
<main class="container py-5">
    <div class="mb-4">
        <p class="text-secondary mb-1" th:text="${result.quizTypeLabel()}">퀴즈 유형</p>
        <h1 class="h3 mb-0">퀴즈 결과</h1>
    </div>

    <section class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm"><div class="card-body"><p class="text-secondary mb-1">총 문제</p><strong class="h4" th:text="${result.totalQuestions()}">0</strong></div></div></div>
        <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm"><div class="card-body"><p class="text-secondary mb-1">정답</p><strong class="h4 text-success" th:text="${result.correctCount()}">0</strong></div></div></div>
        <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm"><div class="card-body"><p class="text-secondary mb-1">오답</p><strong class="h4 text-danger" th:text="${result.wrongCount()}">0</strong></div></div></div>
        <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm"><div class="card-body"><p class="text-secondary mb-1">정답률</p><strong class="h4"><span th:text="${result.correctRate()}">0</span>%</strong></div></div></div>
    </section>

    <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">선택한 학습 자료</h2>
            <div class="d-flex flex-wrap gap-2">
                <span th:each="title : ${result.materialTitles()}" class="badge text-bg-light border" th:text="${title}">자료</span>
            </div>
        </div>
    </section>

    <section class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr><th style="width: 90px;">번호</th><th>문제</th><th>제출 답안</th><th>정답</th><th style="width: 90px;">결과</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="question : ${result.questionResults()}">
                        <td th:text="${question.questionOrder()}">1</td>
                        <td class="fw-semibold" th:text="${question.questionText()}">문제</td>
                        <td th:text="${question.submittedAnswer()} ?: '-'">-</td>
                        <td th:text="${question.correctAnswer()}">정답</td>
                        <td>
                            <span th:if="${question.correct()}" class="badge text-bg-success">정답</span>
                            <span th:unless="${question.correct()}" class="badge text-bg-danger">오답</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
