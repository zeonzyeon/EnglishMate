<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EnglishMate</a>
        <div class="d-flex gap-2">
            <a th:href="@{/materials}" class="btn btn-outline-secondary btn-sm">Study Materials</a>
            <a th:href="@{/vocabulary}" class="btn btn-outline-primary btn-sm">My Vocabulary</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="mb-4">
        <h1 class="h3 mb-1">Quiz</h1>
        <p class="text-secondary mb-0">단어장에 저장하고 의미를 입력한 단어로 퀴즈를 시작하세요.</p>
    </div>

    <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>

    <form th:action="@{/quiz/start}" th:object="${form}" method="post" class="row g-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <section class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body p-4">
                    <h2 class="h5 mb-3">퀴즈 유형</h2>

                    <div class="border rounded p-3 bg-white mb-3">
                        <div class="fw-semibold mb-2">객관식</div>
                        <div class="vstack gap-2 ps-3">
                            <label class="form-check mb-0">
                                <input type="radio"
                                       th:field="*{quizType}"
                                       value="WORD_TO_MEANING_MULTIPLE_CHOICE"
                                       class="form-check-input">
                                <span class="form-check-label">의미 맞추기</span>
                            </label>
                            <label class="form-check mb-0">
                                <input type="radio"
                                       th:field="*{quizType}"
                                       value="MEANING_TO_WORD_MULTIPLE_CHOICE"
                                       class="form-check-input">
                                <span class="form-check-label">단어 맞추기</span>
                            </label>
                        </div>
                    </div>

                    <div class="border rounded p-3 bg-white">
                        <div class="fw-semibold mb-2">주관식</div>
                        <div class="vstack gap-2 ps-3">
                            <label class="form-check mb-0">
                                <input type="radio"
                                       th:field="*{quizType}"
                                       value="WORD_TO_MEANING_WRITTEN"
                                       class="form-check-input">
                                <span class="form-check-label">의미 입력</span>
                            </label>
                            <label class="form-check mb-0">
                                <input type="radio"
                                       th:field="*{quizType}"
                                       value="MEANING_TO_WORD_WRITTEN"
                                       class="form-check-input">
                                <span class="form-check-label">단어 입력</span>
                            </label>
                        </div>
                    </div>

                    <div class="text-danger small mt-2"
                         th:if="${#fields.hasErrors('quizType')}"
                         th:errors="*{quizType}"></div>
                </div>
            </div>
        </section>

        <section class="col-12 col-lg-7">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">학습 자료 선택</h2>
                        <span class="badge text-bg-light border">
                            <span id="selectedMaterialCount">0</span>개 선택
                        </span>
                    </div>

                    <label class="border rounded p-3 bg-white d-block mb-2">
                        <input type="checkbox"
                               th:field="*{selectAllMaterials}"
                               id="selectAllMaterials"
                               class="form-check-input me-2">
                        <span class="fw-semibold">전체</span>
                    </label>

                    <div th:if="${#lists.isEmpty(scopeItems)}" class="text-center text-secondary py-4">
                        등록된 학습 자료가 없습니다.
                    </div>

                    <div th:unless="${#lists.isEmpty(scopeItems)}" class="vstack gap-2">
                        <label th:each="item : ${scopeItems}" class="border rounded p-3 bg-white material-option">
                            <input type="checkbox"
                                   name="selectedStudyMaterialIds"
                                   th:value="${item.id()}"
                                   class="form-check-input me-2 material-checkbox">
                            <span th:text="${item.title()}">학습 자료</span>
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <div class="col-12 d-flex justify-content-end gap-2">
            <a th:href="@{/}" class="btn btn-outline-secondary">취소</a>
            <button type="submit" class="btn btn-primary">퀴즈 시작</button>
        </div>
    </form>
</main>

<script>
    const selectAll = document.getElementById('selectAllMaterials');
    const materialCheckboxes = Array.from(document.querySelectorAll('.material-checkbox'));
    const selectedCount = document.getElementById('selectedMaterialCount');

    function updateSelectedCount() {
        if (selectAll.checked) {
            materialCheckboxes.forEach((checkbox) => {
                checkbox.checked = true;
                checkbox.disabled = false;
            });
        } else {
            materialCheckboxes.forEach((checkbox) => {
                checkbox.disabled = false;
                checkbox.checked = false;
            });
        }

        selectedCount.textContent = String(materialCheckboxes.filter((checkbox) => checkbox.checked).length);
    }

    selectAll.addEventListener('change', updateSelectedCount);
    materialCheckboxes.forEach((checkbox) => {
        checkbox.addEventListener('change', () => {
            const checkedCount = materialCheckboxes.filter((item) => item.checked).length;
            selectAll.checked = checkedCount === materialCheckboxes.length;
            selectedCount.textContent = String(materialCheckboxes.filter((item) => item.checked).length);
        });
    });
    updateSelectedCount();
</script>
</body>
</html>
