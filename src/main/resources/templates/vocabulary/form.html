<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>단어 등록 - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EnglishMate</a>
        <a th:href="@{/vocabulary}" class="btn btn-outline-secondary btn-sm">목록으로</a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="mb-4">
                <h1 class="h3 mb-1">단어 등록</h1>
                <p class="text-secondary mb-0">지문 없이도 개인 단어장에 단어를 직접 추가할 수 있습니다.</p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/vocabulary}"
                          th:object="${form}"
                          method="post"
                          novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label for="text" class="form-label">단어</label>
                            <input type="text"
                                   id="text"
                                   th:field="*{text}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('text')} ? 'is-invalid'"
                                   maxlength="100"
                                   placeholder="예: apple">
                            <div class="invalid-feedback" th:errors="*{text}"></div>
                            <div class="form-text">입력한 단어는 기본형으로 정규화되어 저장됩니다.</div>
                        </div>

                        <div class="mb-3">
                            <label for="meaning" class="form-label">의미</label>
                            <input type="text"
                                   id="meaning"
                                   th:field="*{meaning}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('meaning')} ? 'is-invalid'"
                                   maxlength="255"
                                   placeholder="예: 사과">
                            <div class="invalid-feedback" th:errors="*{meaning}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="partOfSpeech" class="form-label">품사</label>
                            <select id="partOfSpeech"
                                    th:field="*{partOfSpeech}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('partOfSpeech')} ? 'is-invalid'">
                                <option value="">선택 안 함</option>
                                <option th:each="part : ${partsOfSpeech}"
                                        th:value="${part.value()}"
                                        th:text="${part.label()}">
                                    Noun(명사)
                                </option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{partOfSpeech}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">저장</button>
                            <a th:href="@{/vocabulary}" class="btn btn-outline-secondary">취소</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
