<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Vocabulary - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EnglishMate</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-secondary">안녕하세요, <strong th:text="${nickname}">회원</strong>님</span>
            <a th:href="@{/materials}" class="btn btn-outline-secondary btn-sm">Study Materials</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">My Vocabulary</h1>
            <p class="text-secondary mb-0">저장한 개인 단어를 기본형 기준 알파벳순으로 확인하세요.</p>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(vocabularies)}" class="p-5 text-center text-secondary">
                저장된 단어가 없습니다.
            </div>

            <div th:unless="${#lists.isEmpty(vocabularies)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>기본형</th>
                        <th>추출 단어</th>
                        <th>의미</th>
                        <th>품사</th>
                        <th class="text-end" style="width: 180px;">관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="vocabulary : ${vocabularies}">
                        <td class="fw-semibold" th:text="${vocabulary.normalizedText()}">base</td>
                        <td class="text-secondary" th:text="${vocabulary.text()}">word</td>
                        <td th:text="${#strings.isEmpty(vocabulary.meaning()) ? '-' : vocabulary.meaning()}">
                            -
                        </td>
                        <td th:text="${vocabulary.partOfSpeechLabel()}">
                            -
                        </td>
                        <td class="text-end">
                            <div class="d-flex justify-content-end gap-2 flex-nowrap">
                                <a th:href="@{/words/{id}/edit(id=${vocabulary.wordId()}, redirectUrl=${'/vocabulary'})}"
                                   class="btn btn-outline-secondary btn-sm"
                                   style="width: 86px;">의미 수정</a>
                                <form th:action="@{/vocabulary/{id}/delete(id=${vocabulary.id()})}"
                                      method="post"
                                      onsubmit="return confirm('단어장에서 삭제하시겠습니까?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" style="width: 64px;">삭제</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
