<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Materials - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: mainNavbar}"></div>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Study Materials</h1>
            <p class="text-secondary mb-0">영어 학습 지문을 등록하고 관리하세요.</p>
        </div>
        <a th:if="${loggedIn}" th:href="@{/materials/new}" class="btn btn-primary">등록</a>
        <button th:unless="${loggedIn}" type="button" class="btn btn-primary"
                data-login-required-message="학습자료 등록은 로그인 후 이용할 수 있습니다.">등록</button>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(materials)}" class="p-5 text-center text-secondary">등록된 학습 자료가 없습니다.</div>

            <div th:unless="${#lists.isEmpty(materials)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>제목</th>
                        <th>작성일</th>
                        <th>수정일</th>
                        <th class="text-end">상세보기</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="material : ${materials}">
                        <td class="fw-semibold" th:text="${material.title()}">제목</td>
                        <td th:text="${#temporals.format(material.createdAt(), 'yyyy-MM-dd HH:mm')}">작성일</td>
                        <td th:text="${#temporals.format(material.updatedAt(), 'yyyy-MM-dd HH:mm')}">수정일</td>
                        <td class="text-end">
                            <a th:href="@{/materials/{id}(id=${material.id()})}" class="btn btn-outline-primary btn-sm">상세보기</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
