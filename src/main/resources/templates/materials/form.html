<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode == 'edit'} ? '학습 자료 수정 - EnglishMate' : '학습 자료 등록 - EnglishMate'">Study Material Form - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: mainNavbar}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="mb-4">
                <h1 class="h3 mb-1" th:text="${mode == 'edit'} ? '학습 자료 수정' : '학습 자료 등록'">학습 자료 등록</h1>
                <p class="text-secondary mb-0">영어 지문을 입력하면 단어 추출과 퀴즈 생성에 사용할 수 있습니다.</p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="${mode == 'edit'} ? @{/materials/{id}(id=${materialId})} : @{/materials}" th:object="${form}" method="post" th:attr="onsubmit=${mode == 'edit'} ? 'return confirmMaterialUpdate();' : null" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label for="title" class="form-label">제목</label>
                            <input type="text" id="title" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" maxlength="100" placeholder="학습 자료 제목">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="content" class="form-label">영어 지문</label>
                            <textarea id="content" th:field="*{content}" class="form-control" th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'" rows="14" maxlength="10000" placeholder="영어 학습 지문을 입력하세요"></textarea>
                            <div class="invalid-feedback" th:errors="*{content}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">저장</button>
                            <a th:href="${mode == 'edit'} ? @{/materials/{id}(id=${materialId})} : @{/materials}" class="btn btn-outline-secondary">취소</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    function confirmMaterialUpdate() {
        return confirm(
            '지문을 수정하면 기존에 추출된 단어 목록을 삭제하고, 변경된 지문을 기준으로 단어가 다시 추출됩니다. ' +
            '개인 단어장에 저장한 단어와 입력한 의미/품사는 유지됩니다. 수정하시겠습니까?'
        );
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
