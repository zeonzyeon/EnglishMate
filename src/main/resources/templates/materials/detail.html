<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${material.title()} + ' - EnglishMate'">Study Material - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: mainNavbar}"></div>
<main class="container py-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>

    <div th:if="${extractResult}" class="alert alert-info">
        추출된 단어 개수: <strong th:text="${extractResult.extractedWordCount()}">0</strong>개
        새로 저장된 단어 개수: <strong th:text="${extractResult.savedWordCount()}">0</strong>개
    </div>

    <article class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between gap-3 align-items-start mb-4">
                <div>
                    <h1 class="h3 mb-2" th:text="${material.title()}">제목</h1>
                    <p class="text-secondary mb-0">
                        작성일 <span th:text="${#temporals.format(material.createdAt(), 'yyyy-MM-dd HH:mm')}">작성일</span>
                        · 수정일 <span th:text="${#temporals.format(material.updatedAt(), 'yyyy-MM-dd HH:mm')}">수정일</span>
                    </p>
                </div>
            </div>

            <div class="border rounded bg-light p-4 mb-4">
                <p class="mb-0" style="white-space: pre-line;" th:text="${material.content()}">본문</p>
            </div>

            <div class="d-flex flex-wrap gap-2">
                <form th:if="${loggedIn and material.personal()}" th:action="@{/materials/{id}/extract(id=${material.id()})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-success">단어 추출</button>
                </form>
                <button th:unless="${loggedIn}" type="button" class="btn btn-success"
                        data-login-required-message="단어 추출은 로그인 후 이용할 수 있습니다.">단어 추출</button>

                <a th:if="${loggedIn and material.personal()}" th:href="@{/materials/{id}/edit(id=${material.id()})}" class="btn btn-primary">수정</a>
                <button th:unless="${loggedIn}" type="button" class="btn btn-primary"
                        data-login-required-message="학습자료 수정은 로그인 후 이용할 수 있습니다.">수정</button>

                <form th:if="${loggedIn and material.personal()}" th:action="@{/materials/{id}/delete(id=${material.id()})}" method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger">삭제</button>
                </form>
                <form th:if="${loggedIn and material.sample()}" th:action="@{/materials/{id}/delete(id=${material.id()})}" method="post"
                      onsubmit="return confirm('이 예시 지문을 내 목록에서 숨기시겠습니까?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger">예시 숨기기</button>
                </form>
                <button th:unless="${loggedIn}" type="button" class="btn btn-outline-danger"
                        data-login-required-message="학습자료 삭제는 로그인 후 이용할 수 있습니다.">삭제</button>

                <a th:href="@{/materials}" class="btn btn-outline-secondary">목록으로</a>
            </div>
        </div>
    </article>

    <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">추출 단어 목록</h2>
                <span class="badge text-bg-light border fs-6"><span th:text="${extractedWordCount}">0</span>개</span>
            </div>

            <div th:if="${#lists.isEmpty(extractedWords)}" class="text-center text-secondary py-4">아직 추출된 단어가 없습니다.</div>

            <div th:unless="${#lists.isEmpty(extractedWords)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>기본형</th>
                        <th>추출 단어</th>
                        <th>의미</th>
                        <th>품사</th>
                        <th>빈도</th>
                        <th class="text-end" style="width: 260px;">관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="word : ${extractedWords}">
                        <td class="fw-semibold" th:text="${word.normalizedText()}">normalized</td>
                        <td class="text-secondary" th:text="${word.text()}">word</td>
                        <td th:text="${#strings.isEmpty(word.meaning()) ? '-' : word.meaning()}">의미</td>
                        <td th:text="${word.partOfSpeechLabel()}">품사</td>
                        <td th:text="${word.frequency()}">1</td>
                        <td class="text-end">
                            <div class="d-flex justify-content-end gap-2 flex-nowrap">
                                <a th:if="${loggedIn}" th:href="@{/words/{id}/edit(id=${word.wordId()}, redirectUrl=${'/materials/' + material.id()})}" class="btn btn-outline-secondary btn-sm" style="width: 92px; white-space: nowrap;" th:text="${#strings.isEmpty(word.meaning()) ? '의미 입력' : '의미 수정'}">의미 입력</a>
                                <button th:unless="${loggedIn}" type="button" class="btn btn-outline-secondary btn-sm"
                                        style="width: 92px; white-space: nowrap;"
                                        data-login-required-message="단어 의미 수정은 로그인 후 이용할 수 있습니다.">의미 수정</button>

                                <button th:if="${loggedIn and word.savedInVocabulary()}" type="button" class="btn btn-secondary btn-sm" style="width: 112px; white-space: nowrap;" disabled>추가됨</button>
                                <form th:if="${loggedIn and !word.savedInVocabulary()}" th:action="@{/vocabulary/{wordId}(wordId=${word.wordId()})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-outline-primary btn-sm" style="width: 112px; white-space: nowrap;">단어장 추가</button>
                                </form>
                                <button th:unless="${loggedIn}" type="button" class="btn btn-outline-primary btn-sm"
                                        style="width: 112px; white-space: nowrap;"
                                        data-login-required-message="단어장 기능은 로그인 후 이용할 수 있습니다.">단어장 추가</button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
