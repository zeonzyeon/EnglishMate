<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${material.title()} + ' - EnglishMate'">Study Material - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">EnglishMate</a>
        <div class="d-flex gap-2">
            <a th:href="@{/vocabulary}" class="btn btn-outline-primary btn-sm">My Vocabulary</a>
            <a th:href="@{/materials}" class="btn btn-outline-secondary btn-sm">목록으로</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>

    <div th:if="${extractResult}" class="alert alert-info">
        추출된 단어 개수:
        <strong th:text="${extractResult.extractedWordCount()}">0</strong>개
        새로 저장된 단어 개수:
        <strong th:text="${extractResult.savedWordCount()}">0</strong>개
    </div>

    <article class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between gap-3 align-items-start mb-4">
                <div>
                    <h1 class="h3 mb-2" th:text="${material.title()}">제목</h1>
                    <p class="text-secondary mb-0">
                        작성일
                        <span th:text="${#temporals.format(material.createdAt(), 'yyyy-MM-dd HH:mm')}">작성일</span>
                        · 수정일
                        <span th:text="${#temporals.format(material.updatedAt(), 'yyyy-MM-dd HH:mm')}">수정일</span>
                    </p>
                </div>
            </div>

            <div class="border rounded bg-light p-4 mb-4">
                <p class="mb-0" style="white-space: pre-line;" th:text="${material.content()}">본문</p>
            </div>

            <div class="d-flex flex-wrap gap-2">
                <form th:action="@{/materials/{id}/extract(id=${material.id()})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-success">단어 추출</button>
                </form>
                <a th:href="@{/materials/{id}/edit(id=${material.id()})}" class="btn btn-primary">수정</a>
                <form th:action="@{/materials/{id}/delete(id=${material.id()})}"
                      method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger">삭제</button>
                </form>
                <a th:href="@{/materials}" class="btn btn-outline-secondary">목록으로</a>
            </div>
        </div>
    </article>

    <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h2 class="h5 mb-1">추출 단어 목록</h2>
                    <p class="text-secondary mb-0">기본형을 기준으로 확인하고 원하는 단어만 개인 단어장에 추가하세요.</p>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(extractedWords)}" class="text-center text-secondary py-4">
                아직 추출된 단어가 없습니다.
            </div>

            <div th:unless="${#lists.isEmpty(extractedWords)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>기본형</th>
                        <th>추출 단어</th>
                        <th>의미</th>
                        <th>품사</th>
                        <th>빈도</th>
                        <th class="text-end" style="width: 260px;">관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="word : ${extractedWords}">
                        <td class="fw-semibold" th:text="${word.normalizedText()}">normalized</td>
                        <td class="text-secondary" th:text="${word.text()}">word</td>
                        <td th:text="${#strings.isEmpty(word.meaning()) ? '-' : word.meaning()}">의미</td>
                        <td th:text="${word.partOfSpeechLabel()}">품사</td>
                        <td th:text="${word.frequency()}">1</td>
                        <td class="text-end">
                            <div class="d-flex justify-content-end gap-2 flex-nowrap">
                                <a th:href="@{/words/{id}/edit(id=${word.wordId()}, redirectUrl=${'/materials/' + material.id()})}"
                                   class="btn btn-outline-secondary btn-sm"
                                   style="width: 92px; white-space: nowrap;"
                                   th:text="${#strings.isEmpty(word.meaning()) ? '의미 입력' : '의미 수정'}">
                                    의미 입력
                                </a>
                                <button th:if="${word.savedInVocabulary()}"
                                        type="button"
                                        class="btn btn-secondary btn-sm"
                                        style="width: 112px; white-space: nowrap;"
                                        disabled>
                                    추가됨
                                </button>
                                <form th:unless="${word.savedInVocabulary()}"
                                      th:action="@{/vocabulary/{wordId}(wordId=${word.wordId()})}"
                                      method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-outline-primary btn-sm" style="width: 112px; white-space: nowrap;">단어장 추가</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</body>
</html>
