<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-panel">
        <div class="auth-story">
            <a th:href="@{/}" class="auth-brand">EnglishMate</a>

            <div class="auth-copy compact-copy">
                <h1>
                    <span>EnglishMate</span>
                    <span>Personal English Learning</span>
                </h1>
            </div>

            <ul class="auth-points">
                <li>내 학습 자료 기반 단어 추출</li>
                <li>개인 단어장 관리</li>
                <li>퀴즈와 플래시 카드 복습으로 반복 학습</li>
            </ul>
        </div>

        <div class="auth-form-card">
            <div class="mb-4">
                <h2 class="h3 mb-0">로그인</h2>
            </div>

            <div th:if="${param.error}" class="alert alert-danger">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                로그아웃되었습니다.
            </div>
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control form-control-lg"
                           placeholder="name@example.com"

                           required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control form-control-lg"

                           required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">로그인</button>
                <p class="text-secondary text-center mb-0">
                    아직 계정이 없나요?
                    <a th:href="@{/signup}" class="auth-link">회원가입</a>
                </p>
            </form>
        </div>
    </section>
</main>
</body>
</html>
