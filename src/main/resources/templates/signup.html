<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnglishMate 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4 text-center">EnglishMate 회원가입</h1>

                    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

                    <form th:action="@{/signup}" th:object="${signupForm}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="name@example.com">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password"
                                   id="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   placeholder="8자 이상 30자 이하">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="nickname" class="form-label">닉네임</label>
                            <input type="text"
                                   id="nickname"
                                   th:field="*{nickname}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'"
                                   placeholder="2자 이상 20자 이하">
                            <div class="invalid-feedback" th:errors="*{nickname}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">가입하기</button>
                        <a th:href="@{/login}" class="btn btn-outline-secondary w-100">로그인으로 이동</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
