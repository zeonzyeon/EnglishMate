<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - EnglishMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-panel">
        <div class="auth-story">
            <a th:href="@{/}" class="auth-brand">EnglishMate</a>

            <div class="auth-copy compact-copy">
                <h1>
                    <span>EnglishMate</span>
                    <span>Personal English Learning</span>
                </h1>
                <p class="signup-subtitle">Create a personal space for English study.</p>
            </div>

            <ul class="auth-points">
                <li>내 학습 자료 기반 단어 추출</li>
                <li>개인 단어장 관리</li>
                <li>퀴즈와 플래시 카드 복습으로 반복 학습</li>
            </ul>
        </div>

        <div class="auth-form-card">
            <div class="mb-4">
                <h2 class="h3 mb-0">회원가입</h2>
            </div>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="@{/signup}" th:object="${signupForm}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="name@example.com">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           placeholder="8자 이상 30자 이하">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                    <input type="password"
                           id="confirmPassword"
                           th:field="*{confirmPassword}"
                           class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           placeholder="비밀번호 확인">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>

                <div class="mb-4">
                    <label for="nickname" class="form-label">닉네임</label>
                    <input type="text"
                           id="nickname"
                           th:field="*{nickname}"
                           class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'"
                           placeholder="2자 이상 20자 이하">
                    <div class="invalid-feedback" th:errors="*{nickname}"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">가입하기</button>
                <p class="text-secondary text-center mb-0">
                    이미 계정이 있나요?
                    <a th:href="@{/login}" class="auth-link">로그인</a>
                </p>
            </form>
        </div>
    </section>
</main>
</body>
</html>
